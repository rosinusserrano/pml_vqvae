# experiment config
experiment_name: "pixelcnn full imagenet one hot unconditional (correct dilations)" # name of the experiment
description: "" # description of the experiment
seed: 42 # seed for reproducibility
test_interval: 1 # test the model every test_interval epochs, None to disable
vis_train_interval: 1 # plot the training loss every plot_train_interval epochs, None to disable
wandb_log: true # log the experiment to wandb

#dataset config
n_train: 100000 # number of training samples
n_test: 5000 # number of test samples
dataset: "latent /workspace/final_replacement_vqvae/imagenet_latents.tar.gz" # either cifar or imagenet
class_idx: null # list of class indices to use, empty list to use all classes
hyperclass: false # use hyperclasses

# train config
batch_size: 32
epochs: 20
learning_rate: 0.001
label_conditioning: false
weight_decay: 0.01
convergence_patience: 3
convergence_performance_threshold: 0.999
convergence_key: null

# model config
model_name: "pixelcnn" # either autoencoder or vae

# PixelCNN
model_config:
  hidden_chan: 128
  num_codes: 1024
  num_classes: null
  input_shape: [32, 32]  # for mnist
  conditional_embedding_dim: null
  dilations: "1-2-1-3-1-4-1-3-1-2-1"
  conditional: False
  vqvae_path: /workspace/final_replacement_vqvae
  use_one_hot: True
  use_code_embeddings: False

