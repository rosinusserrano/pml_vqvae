# experiment config
experiment_name: "[fixed embeds] VQVAE" # name of the experiment
description: "" # description of the experiment
seed: 42 # seed for reproducibility
test_interval: 1 # test the model every test_interval epochs, None to disable
vis_train_interval: 1 # plot the training loss every plot_train_interval epochs, None to disable
wandb_log: True # log the experiment to wandb

#dataset config
n_train: 20000 # number of training samples
n_test: 2000 # number of test samples
dataset: "imagenet" # either cifar or imagenet
class_idx: null # list of class indices to use, empty list to use all classes

# train config
batch_size: 32
epochs: 10
learning_rate: 0.0001
label_conditioning: False

# model config
model_name: "vqvae" # either autoencoder or vae

# PixelCNN
# model_config:
#   hidden_chan: 256
#   num_codes: 256
#   num_classes: 10
#   input_shape: [28, 28]  # for mnist

# VQVAE
model_config:
  codebook_size: 1024
  commitment_weight: 10.0
  hidden_dimension: 256
  embedding_dimension: 256
  codebook_initialization_radius: 0.1
  fixed_embeds: True
